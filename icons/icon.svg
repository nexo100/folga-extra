<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="palmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Sun Rays & Glow -->
  <circle cx="340" cy="180" r="70" fill="url(#sunGrad)" opacity="0.25"/>
  <circle cx="340" cy="180" r="50" fill="url(#sunGrad)"/>

  <!-- Island Mound -->
  <path d="M 80 430 Q 256 360 432 430 L 432 460 L 80 460 Z" fill="#1e293b"/>

  <!-- Palm Tree Trunk -->
  <path d="M 230 420 Q 210 320 250 220 Q 256 220 262 225 Q 225 320 248 420 Z" fill="url(#trunkGrad)"/>

  <!-- Palm Fronds / Leaves -->
  <!-- Leaf 1 (Top Left) -->
  <path d="M 252 222 Q 170 170 120 210 Q 180 230 252 222 Z" fill="url(#palmGrad)"/>
  <!-- Leaf 2 (Left) -->
  <path d="M 252 222 Q 150 230 110 280 Q 180 290 252 222 Z" fill="url(#palmGrad)"/>
  <!-- Leaf 3 (Top) -->
  <path d="M 252 222 Q 240 120 280 90 Q 290 160 252 222 Z" fill="url(#palmGrad)"/>
  <!-- Leaf 4 (Top Right) -->
  <path d="M 252 222 Q 330 140 390 160 Q 340 210 252 222 Z" fill="url(#palmGrad)"/>
  <!-- Leaf 5 (Right) -->
  <path d="M 252 222 Q 350 230 400 270 Q 330 280 252 222 Z" fill="url(#palmGrad)"/>

  <!-- Sparkles / Stars -->
  <path d="M 140 120 L 146 134 L 160 140 L 146 146 L 140 160 L 134 146 L 120 140 L 134 134 Z" fill="#fbbf24" opacity="0.9"/>
  <path d="M 390 90 L 394 100 L 404 104 L 394 108 L 390 118 L 386 108 L 376 104 L 386 100 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M 90 320 L 93 328 L 101 331 L 93 334 L 90 342 L 87 334 L 79 331 L 87 328 Z" fill="#fbbf24" opacity="0.7"/>
